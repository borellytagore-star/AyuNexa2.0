<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210" width="280" height="210">
  <defs>
    <linearGradient id="an-ribbon-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a044e" />
      <stop offset="30%" stop-color="#701a75" />
      <stop offset="65%" stop-color="#a21caf" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="an-ribbon-fold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="45%" stop-color="#be185d" />
      <stop offset="80%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="an-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <filter id="an-soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4a044e" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#an-soft-shadow)">
    <!-- 1. Outer Ribbon Swoop -->
    <path d="M 52 145 C 50 115, 68 70, 95 40 C 112 20, 130 10, 148 10 C 168 10, 185 24, 195 48 C 205 70, 208 95, 206 120 C 204 140, 192 165, 175 180 C 158 195, 135 198, 115 198 C 88 198, 62 185, 48 170 C 35 156, 28 140, 28 132 C 28 128, 38 122, 45 125 C 52 128, 55 142, 68 152 C 78 160, 95 168, 115 168 C 135 168, 150 162, 160 150 C 172 135, 175 110, 170 85 C 165 60, 152 40, 142 32 C 134 26, 122 26, 112 38 C 92 62, 75 102, 72 138 Z" fill="url(#an-ribbon-primary)" />

    <!-- 2. Ribbon Apex Fold -->
    <path d="M 125 12 C 140 10, 155 14, 165 24 C 180 38, 190 62, 195 90 C 182 82, 170 76, 158 72 C 154 52, 146 36, 136 26 C 132 22, 128 16, 125 12 Z" fill="url(#an-ribbon-fold)" />

    <!-- 3. Lower Flowing Ribbon Swoop -->
    <path d="M 28 132 C 45 120, 75 95, 112 80 C 145 66, 180 62, 215 72 C 235 78, 252 88, 260 100 C 255 112, 238 118, 218 116 C 188 113, 158 120, 130 132 C 100 145, 68 165, 48 170 C 35 156, 28 140, 28 132 Z" fill="url(#an-ribbon-primary)" />

    <!-- 4. Ribbon Tail -->
    <path d="M 130 132 C 160 120, 192 118, 222 122 C 242 125, 260 135, 272 148 C 265 156, 248 160, 228 158 C 198 155, 165 165, 138 178 C 122 186, 102 195, 88 198 C 105 180, 118 155, 130 132 Z" fill="url(#an-ribbon-fold)" />

    <!-- 5. Heart Figures -->
    <circle cx="120" cy="85" r="11" fill="#4a044e" />
    <circle cx="148" cy="98" r="8.5" fill="#a21caf" />
    <path d="M 112 100 C 104 108, 98 122, 102 138 C 106 150, 116 160, 128 168 C 128 168, 126 152, 120 142 C 114 132, 114 122, 122 114 C 125 110, 130 108, 135 110 C 142 112, 145 120, 142 130 C 138 140, 132 152, 128 168 C 136 160, 150 145, 156 130 C 162 116, 158 106, 148 108 C 140 110, 135 115, 130 118 C 124 108, 118 102, 112 100 Z" fill="#581c87" />
    <path d="M 148 110 C 158 114, 164 125, 162 138 C 160 148, 152 158, 142 165 C 144 154, 148 142, 146 132 C 144 124, 138 118, 134 116 C 138 112, 144 110, 148 110 Z" fill="#a21caf" />

    <!-- 6. Golden Cross -->
    <g transform="translate(172, 70)">
      <rect x="0" y="8" width="28" height="12" rx="4" fill="url(#an-gold-grad)" />
      <rect x="8" y="0" width="12" height="28" rx="4" fill="url(#an-gold-grad)" />
    </g>

    <!-- 7. Golden Leaves -->
    <path d="M 198 88 C 218 80, 235 90, 245 110 C 230 115, 212 110, 198 88 Z" fill="url(#an-gold-grad)" />
    <path d="M 198 88 Q 220 98 245 110" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M 188 108 C 205 106, 222 118, 228 135 C 212 138, 198 130, 188 108 Z" fill="url(#an-gold-grad)" />
    <path d="M 182 128 C 196 128, 208 140, 210 152 C 198 154, 186 146, 182 128 Z" fill="#be185d" />
  </g>
</svg>
